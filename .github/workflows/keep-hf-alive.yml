name: Keep HF Space Awake

on:
  schedule:
    # Runs every 12 hours to keep the space from sleeping
    - cron: '0 */12 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Keep HF Space Alive - Endpoint 1 (predict_text)
        run: |
          curl -X POST "https://arungurajapu-sentiment_analysistthis.hf.space/predict_text" \
            -H "Content-Type: application/json" \
            -d '{"text":"test sentiment analysis"}' \
            --max-time 10 \
            || echo "Endpoint 1 ping sent (space might be waking up)"
        continue-on-error: true

      - name: Keep HF Space Alive - Endpoint 2 (predict)
        run: |
          curl -X POST "https://arungurajapu-sentiment_analysistthis.hf.space/predict" \
            -H "Content-Type: application/json" \
            -d '{"text":"test sentiment analysis"}' \
            --max-time 10 \
            || echo "Endpoint 2 ping sent (space might be waking up)"
        continue-on-error: true

      - name: Verify Space is Running
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "https://arungurajapu-sentiment_analysistthis.hf.space/")
          echo "HF Space Status: $response"
          if [ "$response" = "200" ] || [ "$response" = "307" ] || [ "$response" = "302" ]; then
            echo "✅ Space is running!"
          else
            echo "⚠️ Space may still be waking up (status: $response)"
          fi

      - name: Log Execution Time
        run: |
          echo "Keep-alive ping executed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
